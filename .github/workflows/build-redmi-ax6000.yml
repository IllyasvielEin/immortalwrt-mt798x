name: Build Redmi AX6000 firmware

on:
  workflow_dispatch:
    inputs:
      cold_cache:
        description: 'Fresh runner without restoring or saving download/compiler caches'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: redmi-ax6000-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIG_FILE: defconfig/mt7986-ax6000.config
  TARGET_DIR: bin/targets/mediatek/filogic
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPILERCHECK: content
  AX6000_GO_BOOTSTRAP_MODE: source
  TZ: Asia/Singapore

jobs:
  build:
    name: MTK U-Boot 110M
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout firmware source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check production source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/check-ax6000-production.py
          python3 -m unittest discover -s tests -p 'test_ax6000_*.py' -v

      - name: Record source time and cache inputs
        id: cache_inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          python3 scripts/ax6000-ci-cache.py inputs \
            --bootstrap-mode "$AX6000_GO_BOOTSTRAP_MODE" \
            --output ax6000-cache-inputs.json

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force --volumes || true
          df -h

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang llvm flex bison gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev zlib1g-dev python3-dev python3-setuptools \
            python3-pyelftools python3-cryptography rsync swig unzip file wget \
            pkg-config ca-certificates xz-utils
          clang --version
          for tool in llc llvm-dis llvm-nm opt llvm-strip; do command -v "$tool"; done

      - name: Look up source downloads
        id: downloads_lookup
        if: ${{ !inputs.cold_cache }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: dl
          lookup-only: true
          key: ${{ steps.cache_inputs.outputs.downloads_key }}
          restore-keys: ${{ steps.cache_inputs.outputs.downloads_restore }}

      - name: Restore source downloads
        id: downloads_cache
        if: ${{ !inputs.cold_cache && steps.downloads_lookup.outputs.cache-matched-key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: dl
          key: ${{ steps.downloads_lookup.outputs.cache-matched-key }}

      - name: Look up compiler objects
        id: compiler_lookup
        if: ${{ !inputs.cold_cache }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ccache
          lookup-only: true
          key: ${{ steps.cache_inputs.outputs.compiler_key }}
          restore-keys: ${{ steps.cache_inputs.outputs.compiler_restore }}

      - name: Restore compiler objects
        id: compiler_cache
        if: ${{ !inputs.cold_cache && steps.compiler_lookup.outputs.cache-matched-key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ccache
          key: ${{ steps.compiler_lookup.outputs.cache-matched-key }}

      - name: Validate cache restores or select cold mode
        id: cache_state
        shell: bash
        env:
          AX6000_COLD_CACHE: ${{ inputs.cold_cache }}
          AX6000_DOWNLOADS_LOOKUP_OUTCOME: ${{ steps.downloads_lookup.outcome }}
          AX6000_DOWNLOADS_EXPECTED_KEY: ${{ steps.downloads_lookup.outputs.cache-matched-key }}
          AX6000_DOWNLOADS_RESTORE_OUTCOME: ${{ steps.downloads_cache.outcome }}
          AX6000_DOWNLOADS_RESTORED_KEY: ${{ steps.downloads_cache.outputs.cache-matched-key }}
          AX6000_COMPILER_LOOKUP_OUTCOME: ${{ steps.compiler_lookup.outcome }}
          AX6000_COMPILER_EXPECTED_KEY: ${{ steps.compiler_lookup.outputs.cache-matched-key }}
          AX6000_COMPILER_RESTORE_OUTCOME: ${{ steps.compiler_cache.outcome }}
          AX6000_COMPILER_RESTORED_KEY: ${{ steps.compiler_cache.outputs.cache-matched-key }}
        run: python3 scripts/ax6000-ci-cache.py prepare --output ax6000-cache-state.json

      - name: Update and install feeds
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          python3 scripts/prepare-ax6000-feeds.py
          sh scripts/install-ax6000-feeds.sh "$CONFIG_FILE"

      - name: Generate and validate configuration
        shell: bash
        run: |
          set -euxo pipefail
          cp "$CONFIG_FILE" .config
          make defconfig 2>&1 | tee defconfig.log
          if grep -Eq '(^|:)error:|recursive dependency detected' defconfig.log; then
            exit 1
          fi
          sh scripts/validate-ax6000-config.sh .config
          ./scripts/diffconfig.sh 2>diffconfig.log | tee ax6000.diffconfig
          if grep -Eq '(^|:)error:|recursive dependency detected' diffconfig.log; then
            cat diffconfig.log
            exit 1
          fi

      - name: Record verified build inputs
        id: build_inputs
        run: python3 scripts/ax6000-build-inputs.py prepare --output-dir ax6000-build-inputs

      - name: Download sources
        id: downloads
        shell: bash
        run: |
          set -o pipefail
          if ! make -j4 download 2>&1 | tee download.log; then
            make -j1 V=s download 2>&1 | tee -a download.log
          fi

      - name: Initialize optional build observations
        continue-on-error: true
        env:
          AX6000_COLD_CACHE: ${{ inputs.cold_cache }}
          AX6000_DOWNLOADS_MATCHED_KEY: ${{ steps.downloads_cache.outputs.cache-matched-key }}
          AX6000_COMPILER_MATCHED_KEY: ${{ steps.compiler_cache.outputs.cache-matched-key }}
          AX6000_DOWNLOADS_CACHE_OUTCOME: ${{ steps.downloads_cache.outcome }}
          AX6000_COMPILER_CACHE_OUTCOME: ${{ steps.compiler_cache.outcome }}
        run: python3 scripts/ax6000-ci-metrics.py prepare "$RUNNER_TEMP/ax6000-metrics"

      - name: Build firmware
        id: firmware
        run: python3 scripts/ax6000-ci-build.py

      - name: Record optional compiler and cache statistics
        if: ${{ !cancelled() && steps.firmware.outputs.started == 'true' }}
        continue-on-error: true
        env:
          AX6000_COLD_CACHE: ${{ inputs.cold_cache }}
          AX6000_DOWNLOADS_MATCHED_KEY: ${{ steps.downloads_cache.outputs.cache-matched-key }}
          AX6000_COMPILER_MATCHED_KEY: ${{ steps.compiler_cache.outputs.cache-matched-key }}
          AX6000_DOWNLOADS_CACHE_OUTCOME: ${{ steps.downloads_cache.outcome }}
          AX6000_COMPILER_CACHE_OUTCOME: ${{ steps.compiler_cache.outcome }}
        run: python3 scripts/ax6000-ci-metrics.py report "$RUNNER_TEMP/ax6000-metrics"

      - name: Verify MTK driver artifacts
        shell: bash
        run: |
          set -euo pipefail
          mt_wifi_module="$(find build_dir -type f -path '*/mt_wifi_ap/mt_wifi.ko' -print -quit)"
          test -n "$mt_wifi_module"
          llvm-nm "$mt_wifi_module" > mt-wifi.symbols
          python3 scripts/check-ax6000-production.py --symbols mt-wifi.symbols
          for symbol in \
            RRM_ReadParametersFromFile \
            WNM_ReadParametersFromFile \
            FT_rtmp_read_parameters_from_file
          do
            grep -qw "$symbol" mt-wifi.symbols
          done
          for module in mtk_warp.ko mtk_warp_proxy.ko mtkhnat.ko
          do
            test -n "$(find build_dir -type f -name "$module" -print -quit)"
          done

      - name: Verify images and record revisions
        shell: bash
        run: |
          set -euo pipefail
          factory="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*ax6000-mtkuboot*squashfs-factory.bin' -print -quit)"
          sysupgrade="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*ax6000-mtkuboot*squashfs-sysupgrade.bin' -print -quit)"
          test -n "$factory"
          test -n "$sysupgrade"

          image_size="$(stat -c %s "$factory")"
          image_limit="$((112640 * 1024))"
          test "$image_size" -le "$image_limit"

          cp .config "$TARGET_DIR/ax6000.config"
          cp ax6000.diffconfig "$TARGET_DIR/ax6000.diffconfig"
          python3 scripts/ax6000-build-inputs.py complete \
            --output-dir ax6000-build-inputs --target-dir "$TARGET_DIR"

          sha256sum "$factory" "$sysupgrade" > "$TARGET_DIR/ax6000-images.sha256"
          du -h "$factory" "$sysupgrade"
          cat "$TARGET_DIR/build-metadata.txt"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax6000-mtkuboot-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.TARGET_DIR }}/*ax6000-mtkuboot*
            ${{ env.TARGET_DIR }}/ax6000.config
            ${{ env.TARGET_DIR }}/ax6000.diffconfig
            ${{ env.TARGET_DIR }}/ax6000-images.sha256
            ${{ env.TARGET_DIR }}/build-metadata.txt
            ${{ env.TARGET_DIR }}/ax6000-build-inputs.json
            ${{ env.TARGET_DIR }}/config.buildinfo
            ${{ env.TARGET_DIR }}/feeds.buildinfo
            ${{ env.TARGET_DIR }}/profiles.json
            ${{ env.TARGET_DIR }}/sha256sums
            ${{ env.TARGET_DIR }}/version.buildinfo

      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax6000-failure-logs-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build.log
            download.log
            defconfig.log
            diffconfig.log
            logs

      - name: Upload build inputs and observations
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ax6000-build-observations-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ax6000-build-inputs/
            ax6000-cache-inputs.json
            ax6000-cache-state.json
            ax6000-build-timings.json
            ${{ runner.temp }}/ax6000-metrics/

      - name: Save source downloads after a build attempt
        if: ${{ !cancelled() && !inputs.cold_cache && steps.cache_state.outputs.downloads_save == 'true' && steps.downloads.outcome == 'success' && steps.firmware.outputs.started == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: dl
          key: ${{ steps.cache_inputs.outputs.downloads_key }}

      - name: Save compiler objects after a build attempt
        if: ${{ !cancelled() && !inputs.cold_cache && steps.cache_state.outputs.compiler_save == 'true' && steps.firmware.outputs.started == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ccache
          key: ${{ steps.cache_inputs.outputs.compiler_key }}
