name: Build Redmi AX6000 firmware

on:
  push:
    tags:
      - 'ax6000-*-roam-diag'
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: Merge the latest upstream 25.12 branch before building
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: redmi-ax6000-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIG_FILE: defconfig/mt7986-ax6000.config
  TARGET_DIR: bin/targets/mediatek/filogic
  CCACHE_MAXSIZE: 3G
  TZ: Asia/Singapore

jobs:
  build:
    name: MTK U-Boot 110M
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout firmware source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest upstream source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_upstream }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
          fi
          git fetch upstream 25.12
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit upstream/25.12

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force --volumes || true
          df -h

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang llvm flex bison gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev zlib1g-dev python3-dev python3-setuptools \
            python3-pyelftools python3-cryptography rsync swig unzip file wget \
            pkg-config ca-certificates xz-utils
          clang --version
          for tool in llc llvm-dis llvm-nm opt llvm-strip; do command -v "$tool"; done

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: dl
          key: ax6000-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'defconfig/mt7986-ax6000.config') }}-${{ github.run_id }}
          restore-keys: |
            ax6000-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'defconfig/mt7986-ax6000.config') }}-
            ax6000-dl-${{ runner.os }}-

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ax6000-ccache-${{ runner.os }}-${{ hashFiles('defconfig/mt7986-ax6000.config') }}-${{ github.run_id }}
          restore-keys: |
            ax6000-ccache-${{ runner.os }}-${{ hashFiles('defconfig/mt7986-ax6000.config') }}-
            ax6000-ccache-${{ runner.os }}-

      - name: Pin Build17 feeds for diagnostic comparison
        if: ${{ github.event_name == 'push' }}
        run: cp defconfig/mt7986-ax6000-build17.feeds feeds.conf

      - name: Update and install feeds
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Nikki publishes stable and alpha cores with symmetric CONFLICTS.
          # Keeping both package definitions triggers a Kconfig dependency loop.
          ./scripts/feeds uninstall mihomo-alpha

      - name: Generate and validate configuration
        shell: bash
        run: |
          set -euxo pipefail
          cp "$CONFIG_FILE" .config
          make defconfig
          sh scripts/validate-ax6000-config.sh .config
          ./scripts/diffconfig.sh | tee ax6000.diffconfig

      - name: Download sources
        shell: bash
        run: |
          set -o pipefail
          if ! make -j4 download 2>&1 | tee download.log; then
            make -j1 V=s download 2>&1 | tee -a download.log
          fi

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          if ! make -j4 2>&1 | tee build.log; then
            make -j1 V=s 2>&1 | tee -a build.log
          fi

      - name: Verify MTK driver artifacts
        shell: bash
        run: |
          set -euo pipefail
          mt_wifi_module="$(find build_dir -type f -path '*/mt_wifi_ap/mt_wifi.ko' -print -quit)"
          test -n "$mt_wifi_module"
          llvm-nm "$mt_wifi_module" > mt-wifi.symbols
          for symbol in \
            RRM_ReadParametersFromFile \
            WNM_ReadParametersFromFile \
            FT_rtmp_read_parameters_from_file \
            mt_roam_diag_init \
            mt_roam_diag_packet \
            mt_roam_diag_delete \
            __param_roam_diag_mac \
            __param_roam_diag_port \
            __param_roam_diag_stats
          do
            grep -qw "$symbol" mt-wifi.symbols
          done
          for module in mtk_warp.ko mtk_warp_proxy.ko mtkhnat.ko
          do
            test -n "$(find build_dir -type f -name "$module" -print -quit)"
          done

      - name: Verify images and record revisions
        shell: bash
        run: |
          set -euo pipefail
          factory="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*ax6000-mtkuboot*squashfs-factory.bin' -print -quit)"
          sysupgrade="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*ax6000-mtkuboot*squashfs-sysupgrade.bin' -print -quit)"
          test -n "$factory"
          test -n "$sysupgrade"

          image_size="$(stat -c %s "$factory")"
          image_limit="$((112640 * 1024))"
          test "$image_size" -le "$image_limit"

          cp .config "$TARGET_DIR/ax6000.config"
          cp ax6000.diffconfig "$TARGET_DIR/ax6000.diffconfig"
          cp package/mtk/drivers/mt_wifi/patches-7673/043-roaming-path-diagnostics.patch "$TARGET_DIR/"
          if [ -f feeds.conf ]; then
            cp feeds.conf "$TARGET_DIR/feeds.conf"
          else
            cp feeds.conf.default "$TARGET_DIR/feeds.conf"
          fi
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow_commit=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "roam_diag_default=off"
            echo "roam_diag_patch_sha256=$(sha256sum package/mtk/drivers/mt_wifi/patches-7673/043-roaming-path-diagnostics.patch | cut -d ' ' -f 1)"
            echo "upstream_25_12=$(git rev-parse upstream/25.12 2>/dev/null || echo not-fetched)"
            echo "build_time=$(date --utc --iso-8601=seconds)"
            echo "clang=$(clang --version | head -n1)"
            for feed in feeds/*; do
              if git -C "$feed" rev-parse HEAD >/dev/null 2>&1; then
                echo "feed_$(basename "$feed")=$(git -C "$feed" rev-parse HEAD)"
              fi
            done
          } > "$TARGET_DIR/build-metadata.txt"

          (cd "$TARGET_DIR"; sha256sum "$(basename "$factory")" "$(basename "$sysupgrade")") > "$TARGET_DIR/ax6000-images.sha256"
          du -h "$factory" "$sysupgrade"
          cat "$TARGET_DIR/build-metadata.txt"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax6000-mtkuboot-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.TARGET_DIR }}/*ax6000-mtkuboot*
            ${{ env.TARGET_DIR }}/ax6000.config
            ${{ env.TARGET_DIR }}/ax6000.diffconfig
            ${{ env.TARGET_DIR }}/ax6000-images.sha256
            ${{ env.TARGET_DIR }}/build-metadata.txt
            ${{ env.TARGET_DIR }}/043-roaming-path-diagnostics.patch
            ${{ env.TARGET_DIR }}/feeds.conf
            ${{ env.TARGET_DIR }}/config.buildinfo
            ${{ env.TARGET_DIR }}/feeds.buildinfo
            ${{ env.TARGET_DIR }}/profiles.json
            ${{ env.TARGET_DIR }}/sha256sums
            ${{ env.TARGET_DIR }}/version.buildinfo

      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax6000-failure-logs-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build.log
            download.log
            logs


  publish-diagnostics:
    name: Publish diagnostic prerelease
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified firmware
        uses: actions/download-artifact@v4
        with:
          name: redmi-ax6000-mtkuboot-${{ github.run_number }}
          path: firmware

      - name: Publish diagnostic release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(firmware/*ax6000-mtkuboot*squashfs-sysupgrade.bin)
          test "${#images[@]}" -eq 1
          assets=(
            "${images[0]}"
            firmware/ax6000.config
            firmware/ax6000.diffconfig
            firmware/build-metadata.txt
            firmware/feeds.conf
            firmware/feeds.buildinfo
            firmware/version.buildinfo
            firmware/043-roaming-path-diagnostics.patch
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          (cd firmware; sha256sum "${assets[@]#firmware/}") > firmware/ax6000-roam-diag.sha256
          image_hash="$(sha256sum "${images[0]}")"
          image_hash="${image_hash%% *}"
          {
            echo 'Redmi AX6000 / MTK U-Boot 110M 漫游诊断固件。仅上传 sysupgrade 镜像。'
            echo
            echo '基于 Build17 源码及其六个 feeds 的已公布修订，加入默认关闭的 043 诊断补丁。'
            echo '本版用于确认旧 STA 直转路径及原始删除原因，尚不是永久修复；不修改老化、隔离或加速策略。'
            echo
            printf '源码：%s\n\n' "$GITHUB_SHA"
            printf '构建日志：https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '镜像：%s\n\nSHA-256：%s\n\n' "${images[0]##*/}" "$image_hash"
            echo '配置、MTK 模块符号、镜像大小及 SHA-256 已由 CI 检查；未进行真机刷写或运行验证。'
            echo
            echo '诊断参数位于 /sys/module/mt_wifi/parameters/：'
            echo '- roam_diag_mac：默认 off；可指定一个或两个逗号分隔的单播 MAC。'
            echo '- roam_diag_port：默认 3773；包日志仅覆盖未打 VLAN 标签的 IPv4 TCP SYN/RST 固定头部。'
            echo '- roam_diag_stats：只读累计统计。'
            echo
            echo '限速按日志记录计费：每个 HZ 窗口共享 64 条包阶段记录、16 条管理/删除记录；不是包数或实际删除次数。'
            echo '计数自模块加载累计，跨计数读取不是一致快照；没有日志不能单独证明没有经过某条路径。'
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --draft \
            --title "Redmi AX6000 · $GITHUB_REF_NAME" --notes-file release-notes.md \
            "${assets[@]}" firmware/ax6000-roam-diag.sha256
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
